<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc">
  <title id="title">Kakao Bridge</title><desc id="desc">A connection between the KakaoTalk PC client, command line, and AI workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a2a"/><stop offset=".58" stop-color="#152c38"/><stop offset="1" stop-color="#173c3e"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#ffe266"/><stop offset="1" stop-color="#c6f19c"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263c48"/><stop offset="1" stop-color="#172832"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#8de2b9" stop-opacity=".27"/><stop offset="1" stop-color="#8de2b9" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".12"/></pattern>
  </defs>
  <rect width="1600" height="680" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="680" rx="32" fill="url(#dots)" opacity=".55"/>
  <circle cx="1290" cy="280" r="435" fill="url(#glow)"/>
