  <text x="108" y="363" fill="#c5d9d2" font-family="Segoe UI,Arial,sans-serif" font-size="30">Your KakaoTalk PC, connected to AI and CLI.</text>
  <rect x="108" y="420" width="216" height="52" rx="26" fill="url(#accent)"/>
