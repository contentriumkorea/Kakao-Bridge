  <path d="M865 216h335v25H865z" fill="#2c444d"/>
  <circle cx="893" cy="215" r="5" fill="#ffda6d"/><circle cx="911" cy="215" r="5" fill="#92d6b5"/><circle cx="929" cy="215" r="5" fill="#6a9b99"/>
